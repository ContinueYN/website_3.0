services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - website_net
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: web_backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    restart: unless-stopped
    networks:
      - website_net

networks:
  website_net:
    driver: bridge
