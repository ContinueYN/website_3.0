services:
  postgres:
    image: postgres:15-alpine
    container_name: website_postgres
    environment:
      POSTGRES_USER: ContinueYN
      POSTGRES_PASSWORD: Yn123...
      POSTGRES_DB: website_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ContinueYN"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contact_backend
    ports:
      - "3001:3001"
    working_dir: /app/backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
